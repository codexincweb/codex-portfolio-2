<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project — Codex Inc</title><link rel="stylesheet" href="/styles.css"><script>if(localStorage.getItem("codex-theme")==="dark")document.documentElement.classList.add("dark");</script></head><body><header class="site-header"><div class="wrap nav"><a class="brand" href="/">Codex Inc</a><nav class="navlinks"><a href="/">Home</a><a href="/about.html">About us</a><a href="/works.html">Works</a><a href="/team-up.html">Team Up</a><a href="/services.html">Services</a><a href="/experience.html">Experience</a><a href="/contact.html">Contact</a></nav><div class="nav-actions"><button class="theme-toggle" type="button" data-theme-toggle onclick="toggleTheme()" aria-label="Switch to dark mode" title="Switch to dark mode"></button><a class="btn primary" href="/contact.html">Work with us</a></div></div></header><main class="page"><div class="wrap" id="work-detail"><p class="muted">Loading project…</p></div></main><div data-footer></div><script src="/assets/app.js"></script><script>async function show(){const slug=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop());try{const r=await fetch('/api/works/'+encodeURIComponent(slug));if(!r.ok)throw Error();const x=await r.json();document.title=x.title+' — Codex Inc';document.getElementById('work-detail').innerHTML=`<div class="work-hero"><div><div class="eyebrow">${esc(x.category||'Project')}</div><h1>${esc(x.title)}</h1><p class="lead">${esc(x.summary)}</p><div class="tags">${(x.tech||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="actions">${x.live_url?`<a class="btn primary" target="_blank" rel="noopener" href="${esc(x.live_url)}">Open live project</a>`:''}${x.repo_url?`<a class="btn" target="_blank" rel="noopener" href="${esc(x.repo_url)}">View repository</a>`:''}</div></div><img class="work-cover" src="${esc(x.image_url||'/assets/placeholder.svg')}" alt="${esc(x.title)}"></div><section class="section" style="padding-left:0;padding-right:0"><div class="detail"><div class="eyebrow">Project details</div><h2>What this project is about</h2><p>${esc(x.description||x.summary)}</p></div></section><a class="text-link" href="/works.html">← Back to works</a>`}catch(e){document.getElementById('work-detail').innerHTML='<h1>Project not found</h1><p class="lead">The project you requested could not be found.</p><a class="btn" href="/works.html">Back to works</a>'}}show();</script></body></html>
