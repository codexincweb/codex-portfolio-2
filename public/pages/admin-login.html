<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — Codex Inc</title><link rel="stylesheet" href="/styles.css"></head><body class="admin-shell"><div class="wrap" style="max-width:520px"><div class="form"><div class="eyebrow">Private CMS</div><h1 style="font-size:42px">Admin login</h1><p class="muted">Manage your profile and portfolio projects.</p><div id="msg"></div><form id="login"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="btn primary" style="margin-top:20px;width:100%">Sign in</button></form></div></div><script>login.onsubmit=async e=>{e.preventDefault();msg.innerHTML='';const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(r.ok)location='/admin';else msg.innerHTML='<div class="notice danger">'+(d.error||'Login failed')+'</div>'}</script></body></html>
