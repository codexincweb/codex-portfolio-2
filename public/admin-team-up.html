<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Team Up Applications — Codex Inc">

  <script>
    if(localStorage.getItem("codex-theme")==="dark"){
      document.documentElement.classList.add("dark");
    }
  </script>

  <link rel="stylesheet" href="/styles.css">
<style>
.container{
  width:min(calc(100% - 40px),1160px);
  margin:0 auto;
}

.team-up-admin-grid{
  display:grid;
  grid-template-columns:minmax(280px,.8fr) minmax(320px,1.2fr);
  gap:24px;
}

.application-item{
  border:1px solid #e4e7ec;
  border-radius:12px;
  padding:16px;
  margin-bottom:12px;
  cursor:pointer;
  background:#fff;
}

.application-item:hover,
.application-item.active{
  border-color:#155eef;
}

.status-badge{
  display:inline-flex;
  align-items:center;
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  background:#f2f4f7;
}

.detail-row{
  padding:14px 0;
  border-bottom:1px solid #e4e7ec;
}

.detail-label{
  display:block;
  font-size:12px;
  font-weight:750;
  color:#667085;
  margin-bottom:4px;
}

.detail-value{
  overflow-wrap:anywhere;
}

.action-row{
  display:flex;
  gap:10px;
  margin-top:24px;
  flex-wrap:wrap;
}

.empty-state{
  padding:30px 10px;
  text-align:center;
}

.nav-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.theme-toggle{
  width:42px;
  height:42px;
  border:1px solid #e4e7ec;
  border-radius:8px;
  background:#fff;
  cursor:pointer;
}

@media(max-width:800px){
  .container{
    width:min(calc(100% - 28px),1160px);
  }

  .team-up-admin-grid{
    grid-template-columns:1fr;
  }
}
</style>


  <style>
    .team-up-admin-grid{
      display:grid;
      grid-template-columns:minmax(280px, .8fr) minmax(320px, 1.2fr);
      gap:24px;
    }

    .application-item{
      border:1px solid var(--line);
      border-radius:14px;
      padding:18px;
      margin-bottom:12px;
      cursor:pointer;
      transition:.2s ease;
    }

    .application-item:hover,
    .application-item.active{
      border-color:currentColor;
      transform:translateY(-1px);
    }

    .application-item h3{
      margin:0 0 6px;
    }

    .status-badge{
      display:inline-flex;
      align-items:center;
      border:1px solid var(--line);
      border-radius:999px;
      padding:5px 10px;
      font-size:12px;
      text-transform:capitalize;
    }

    .detail-row{
      padding:14px 0;
      border-bottom:1px solid var(--line);
    }

    .detail-label{
      display:block;
      font-size:12px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.05em;
      margin-bottom:5px;
      opacity:.7;
    }

    .detail-value{
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }

    .action-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:24px;
    }

    .danger-btn{
      border:1px solid #b42318;
      color:#b42318;
      background:transparent;
    }

    .danger-btn:hover{
      background:#b42318;
      color:#fff;
    }

    .success-btn{
      border:1px solid #087443;
      color:#087443;
      background:transparent;
    }

    .success-btn:hover{
      background:#087443;
      color:#fff;
    }

    .empty-state{
      padding:32px 10px;
      text-align:center;
    }

    .resume-link{
      display:inline-block;
      margin-top:8px;
    }

    @media(max-width:800px){
      .team-up-admin-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="container nav">
    <a class="brand" href="/index.html">Codex Inc</a>

    <div class="nav-actions">
      <button
        class="theme-toggle"
        type="button"
        data-theme-toggle
        onclick="toggleTheme()"
        aria-label="Switch theme"
        title="Switch theme">
      </button>

      <button class="btn btn-secondary" type="button" id="logout-btn">
        Logout
      </button>
    </div>
  </div>
</header>

<main class="container" style="padding-top:48px;padding-bottom:64px">

  <div style="margin-bottom:32px">
    <p class="eyebrow">Admin</p>
    <h1>Team Up Applications</h1>
    <p class="muted">
      Review and manage people who want to collaborate with Codex Inc.
    </p>
  </div>

  <div class="team-up-admin-grid">

    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
        <div>
          <h2 style="margin:0">Applications</h2>
          <p class="muted" id="application-count" style="margin:6px 0 0">
            Loading...
          </p>
        </div>

        <button class="btn btn-secondary" type="button" id="refresh-btn">
          Refresh
        </button>
      </div>

      <div id="applications-list" style="margin-top:24px">
        <div class="muted">Loading applications...</div>
      </div>
    </section>

    <section class="card" id="details-card">
      <div id="application-details">
        <div class="empty-state muted">
          Select an application to view its full details.
        </div>
      </div>
    </section>

  </div>

</main>

<script>
function toggleTheme(){
  const dark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('codex-theme', dark ? 'dark' : 'light');
  const button = document.querySelector('[data-theme-toggle]');
  if(button){
    button.setAttribute(
      'aria-label',
      dark ? 'Switch to light mode' : 'Switch to dark mode'
    );
    button.setAttribute(
      'title',
      dark ? 'Switch to light mode' : 'Switch to dark mode'
    );
  }
}

(function(){
  const dark = document.documentElement.classList.contains('dark');
  const button = document.querySelector('[data-theme-toggle]');
  if(button){
    button.setAttribute(
      'aria-label',
      dark ? 'Switch to light mode' : 'Switch to dark mode'
    );
    button.setAttribute(
      'title',
      dark ? 'Switch to light mode' : 'Switch to dark mode'
    );
  }
})();
</script>

<script>
(function(){

  const list = document.querySelector('#applications-list');
  const count = document.querySelector('#application-count');
  const details = document.querySelector('#application-details');
  const refresh = document.querySelector('#refresh-btn');
  const logout = document.querySelector('#logout-btn');

  let applications = [];
  let selectedId = null;

  function escapeHtml(value){
    return String(value ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');
  }

  function formatDate(value){
    if(!value) return '—';

    const date = new Date(value);

    if(Number.isNaN(date.getTime())){
      return escapeHtml(value);
    }

    return date.toLocaleString();
  }

  function renderList(){

    if(!applications.length){
      list.innerHTML = `
        <div class="empty-state muted">
          No Team Up applications yet.
        </div>
      `;

      count.textContent = '0 applications';
      return;
    }

    count.textContent =
      `${applications.length} application${applications.length === 1 ? '' : 's'}`;

    list.innerHTML = applications.map(application => {

      const active = Number(application.id) === Number(selectedId);

      return `
        <article
          class="application-item ${active ? 'active' : ''}"
          data-application-id="${escapeHtml(application.id)}"
        >
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
            <div>
              <h3>${escapeHtml(application.full_name)}</h3>

              <p class="muted" style="margin:0">
                ${escapeHtml(application.country)}
              </p>
            </div>

            <span class="status-badge">
              ${escapeHtml(application.status)}
            </span>
          </div>

          <p class="muted" style="margin:10px 0 0;overflow-wrap:anywhere">
            ${escapeHtml(application.email)}
          </p>
        </article>
      `;

    }).join('');

    document.querySelectorAll('.application-item').forEach(item => {
      item.addEventListener('click', () => {
        const id = Number(item.dataset.applicationId);
        selectApplication(id);
      });
    });
  }

  function selectApplication(id){

    selectedId = id;

    const application = applications.find(
      item => Number(item.id) === Number(id)
    );

    if(!application){
      details.innerHTML = `
        <div class="empty-state muted">
          Application not found.
        </div>
      `;
      return;
    }

    renderList();

    const skills = Array.isArray(application.skills)
      ? application.skills.join(', ')
      : '';

    details.innerHTML = `

      <div style="display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap">
        <div>
          <p class="eyebrow">Application #${escapeHtml(application.id)}</p>
          <h2 style="margin:0">${escapeHtml(application.full_name)}</h2>
        </div>

        <span class="status-badge">
          ${escapeHtml(application.status)}
        </span>
      </div>

      <div style="margin-top:24px">

        <div class="detail-row">
          <span class="detail-label">Country</span>
          <div class="detail-value">${escapeHtml(application.country)}</div>
        </div>

        <div class="detail-row">
          <span class="detail-label">Mobile / WhatsApp</span>
          <div class="detail-value">${escapeHtml(application.mobile)}</div>
        </div>

        <div class="detail-row">
          <span class="detail-label">Email</span>
          <div class="detail-value">
            <a href="mailto:${encodeURIComponent(application.email || '')}">
              ${escapeHtml(application.email)}
            </a>
          </div>
        </div>

        <div class="detail-row">
          <span class="detail-label">Company / Organization</span>
          <div class="detail-value">${escapeHtml(application.company || 'Not provided')}</div>
        </div>

        <div class="detail-row">
          <span class="detail-label">Experience Level</span>
          <div class="detail-value">${escapeHtml(application.experience_level)}</div>
        </div>

        <div class="detail-row">
          <span class="detail-label">Skills</span>
          <div class="detail-value">${escapeHtml(skills || 'Not provided')}</div>
        </div>

        <div class="detail-row">
          <span class="detail-label">Portfolio / Website</span>
          <div class="detail-value">
            ${
              application.portfolio_url
              ? `<a href="${escapeHtml(application.portfolio_url)}" target="_blank" rel="noopener noreferrer">
                   ${escapeHtml(application.portfolio_url)}
                 </a>`
              : 'Not provided'
            }
          </div>
        </div>

        <div class="detail-row">
          <span class="detail-label">About the Applicant</span>
          <div class="detail-value">${escapeHtml(application.bio || 'Not provided')}</div>
        </div>

        <div class="detail-row">
          <span class="detail-label">Resume / CV</span>

          ${
            application.resume_url
            ? `
              <a
                class="btn btn-secondary resume-link"
                href="${escapeHtml(application.resume_url)}"
                target="_blank"
                rel="noopener noreferrer">
                View Resume
              </a>
            `
            : '<div class="muted">No resume available.</div>'
          }
        </div>

        <div class="detail-row">
          <span class="detail-label">Submitted</span>
          <div class="detail-value">${formatDate(application.created_at)}</div>
        </div>

        ${
          application.reviewed_at
          ? `
            <div class="detail-row">
              <span class="detail-label">Reviewed</span>
              <div class="detail-value">${formatDate(application.reviewed_at)}</div>
            </div>
          `
          : ''
        }

        ${
          application.admin_notes
          ? `
            <div class="detail-row">
              <span class="detail-label">Admin Notes</span>
              <div class="detail-value">${escapeHtml(application.admin_notes)}</div>
            </div>
          `
          : ''
        }

        ${
          application.community_link
          ? `
            <div class="detail-row">
              <span class="detail-label">Community Link</span>
              <div class="detail-value">
                <a href="${escapeHtml(application.community_link)}" target="_blank" rel="noopener noreferrer">
                  ${escapeHtml(application.community_link)}
                </a>
              </div>
            </div>
          `
          : ''
        }

      </div>

      <div class="action-row">

        ${
          application.status === 'pending'
          ? `
            <button
              class="btn success-btn"
              type="button"
              id="approve-btn">
              Approve
            </button>

            <button
              class="btn danger-btn"
              type="button"
              id="reject-btn">
              Reject
            </button>
          `
          : ''
        }

      </div>
    `;

    const approveButton = document.querySelector('#approve-btn');
    const rejectButton = document.querySelector('#reject-btn');

    if(approveButton){
      approveButton.addEventListener('click', () => {
        reviewApplication(application, 'approved');
      });
    }

    if(rejectButton){
      rejectButton.addEventListener('click', () => {
        reviewApplication(application, 'rejected');
      });
    }
  }

  async function reviewApplication(application, status){

    const action =
      status === 'approved'
      ? 'approve'
      : 'reject';

    const confirmed = confirm(
      `Are you sure you want to ${action} ${application.full_name}'s application?`
    );

    if(!confirmed) return;

    /*
      The API for this action will be added in the next step.
      For now we deliberately stop here so we do not send
      requests to an endpoint that does not exist yet.
    */

    alert(
      `The ${action} action interface is ready. The secure admin API will be connected next.`
    );
  }

  async function loadApplications(){

    list.innerHTML = '<div class="muted">Loading applications...</div>';

    try{

      const response = await fetch('/api/admin/team-up');

      if(response.status === 401){
        window.location.href = '/admin/login';
        return;
      }

      const data = await response.json();

      if(!response.ok){
        throw new Error(
          data.error || 'Unable to load applications'
        );
      }

      applications = Array.isArray(data) ? data : [];

      if(
        selectedId &&
        !applications.some(
          item => Number(item.id) === Number(selectedId)
        )
      ){
        selectedId = null;
      }

      renderList();

      if(selectedId){
        selectApplication(selectedId);
      }else if(applications.length){
        selectApplication(Number(applications[0].id));
      }else{
        details.innerHTML = `
          <div class="empty-state muted">
            No applications to review yet.
          </div>
        `;
      }

    }catch(error){

      console.error(error);

      list.innerHTML = `
        <div class="muted">
          ${escapeHtml(error.message)}
        </div>
      `;

      details.innerHTML = `
        <div class="empty-state muted">
          Unable to load application details.
        </div>
      `;
    }
  }

  refresh.addEventListener('click', loadApplications);

  logout.addEventListener('click', async () => {

    try{
      await fetch('/api/admin/logout',{
        method:'POST'
      });
    }finally{
      window.location.href='/admin/login';
    }

  });

  loadApplications();

})();
</script>

</body>
</html>
