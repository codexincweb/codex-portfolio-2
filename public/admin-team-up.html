<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Team Up Applications — Codex Inc</title>
  <style>
    :root{
      --bg:#f6f8fb;
      --surface:#ffffff;
      --surface-soft:#f8fafc;
      --text:#101828;
      --muted:#667085;
      --line:#e4e7ec;
      --accent:#155eef;
      --accent-soft:#eef4ff;
      --success:#067647;
      --success-bg:#ecfdf3;
      --danger:#b42318;
      --danger-bg:#fef3f2;
      --shadow:0 8px 30px rgba(16,24,40,.06);
    }

    *{box-sizing:border-box}

    html{background:var(--bg)}

    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.55;
    }

    button,input,textarea{font:inherit}

    .topbar{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(255,255,255,.94);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
    }

    .topbar-inner{
      width:min(1180px,calc(100% - 32px));
      min-height:70px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:800;
      letter-spacing:-.02em;
    }

    .brand-mark{
      width:38px;
      height:38px;
      border-radius:10px;
      display:grid;
      place-items:center;
      background:var(--text);
      color:#fff;
      font-weight:800;
    }

    .top-actions{display:flex;gap:8px}

    .btn{
      border:1px solid var(--line);
      border-radius:9px;
      padding:9px 14px;
      cursor:pointer;
      background:var(--surface);
      color:var(--text);
      font-weight:650;
    }

    .btn:hover{border-color:#b8c0cc}

    .btn.primary{
      background:var(--accent);
      border-color:var(--accent);
      color:#fff;
    }

    main{
      width:min(1180px,calc(100% - 32px));
      margin:32px auto 50px;
    }

    .page-heading{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:20px;
      margin-bottom:22px;
    }

    .page-heading h1{
      margin:0;
      font-size:30px;
      letter-spacing:-.03em;
    }

    .page-heading p{
      margin:5px 0 0;
      color:var(--muted);
    }

    .layout{
      display:grid;
      grid-template-columns:370px minmax(0,1fr);
      gap:22px;
      align-items:start;
    }

    .panel{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .panel-head{
      padding:18px 20px;
      border-bottom:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .panel-head h2{
      margin:0;
      font-size:16px;
    }

    .application-list{padding:12px}

    .application{
      display:block;
      width:100%;
      text-align:left;
      background:transparent;
      color:var(--text);
      border:1px solid transparent;
      border-radius:12px;
      padding:15px;
      margin-bottom:7px;
      cursor:pointer;
      transition:.15s ease;
    }

    .application:hover{
      background:var(--surface-soft);
      border-color:var(--line);
    }

    .application.active{
      background:var(--accent-soft);
      border-color:#b7cbff;
    }

    .application strong{
      display:block;
      font-size:15px;
      margin-bottom:4px;
    }

    .application-email{
      color:var(--muted);
      font-size:13px;
      overflow-wrap:anywhere;
    }

    .status{
      display:inline-flex;
      align-items:center;
      margin-top:9px;
      padding:4px 9px;
      border-radius:999px;
      font-size:11px;
      font-weight:750;
      text-transform:capitalize;
      background:#f2f4f7;
      color:#475467;
    }

    .status-pending{background:#fffaeb;color:#b54708}
    .status-approved{background:var(--success-bg);color:var(--success)}
    .status-rejected{background:var(--danger-bg);color:var(--danger)}

    .details{
      padding:22px;
    }

    .details-header{
      display:flex;
      justify-content:space-between;
      gap:18px;
      align-items:flex-start;
      padding-bottom:20px;
      border-bottom:1px solid var(--line);
    }

    .details-header h2{
      margin:0;
      font-size:22px;
      letter-spacing:-.02em;
    }

    .details-header p{
      margin:4px 0 0;
      color:var(--muted);
    }

    .detail-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:0 24px;
      margin-top:8px;
    }

    .detail{
      padding:15px 0;
      border-bottom:1px solid #f0f2f5;
      min-width:0;
    }

    .detail strong{
      display:block;
      margin-bottom:4px;
      font-size:12px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    .detail-value{
      overflow-wrap:anywhere;
    }

    .detail-full{grid-column:1/-1}

    a{
      color:var(--accent);
      text-decoration:none;
      font-weight:600;
    }

    a:hover{text-decoration:underline}

    .empty{
      padding:40px 20px;
      text-align:center;
      color:var(--muted);
    }

    .count{
      color:var(--muted);
      font-size:13px;
    }

    @media(max-width:800px){
      .layout{grid-template-columns:1fr}
      .page-heading{align-items:flex-start;flex-direction:column}
      .detail-grid{grid-template-columns:1fr}
      .detail-full{grid-column:auto}
    }

    @media(max-width:520px){
      .topbar-inner,main{width:min(100% - 20px,1180px)}
      .topbar-inner{min-height:62px}
      .brand-mark{width:34px;height:34px}
      .brand span{font-size:14px}
      .page-heading h1{font-size:25px}
      .details{padding:17px}
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">C</div>
      <span>Codex Inc · Team Up Admin</span>
    </div>
    <div class="top-actions">
      <button class="btn" id="refresh" type="button">Refresh</button>
      <button class="btn" id="logout" type="button">Logout</button>
    </div>
  </div>
</header>

<main>
  <div class="page-heading">
    <div>
      <h1>Team Up Applications</h1>
      <p>Review collaboration applications submitted to Codex Inc.</p>
    </div>
    <div class="count" id="message">Loading applications...</div>
  </div>

  <div class="layout">
    <section class="panel">
      <div class="panel-head">
        <h2>Applicants</h2>
        <span class="count" id="app-count">—</span>
      </div>
      <div class="application-list" id="applications">Loading...</div>
    </section>

    <section class="panel">
      <div class="details" id="details">
        <div class="empty">Select an applicant to view their application.</div>
      </div>
    </section>
  </div>
</main>

<script>
(function(){
  const applicationsEl = document.getElementById('applications');
  const detailsEl = document.getElementById('details');
  const messageEl = document.getElementById('message');
  const logoutEl = document.getElementById('logout');

  let applications = [];

  function esc(value){
    return String(value ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');
  }

  function showDetails(app){
    detailsEl.innerHTML = `
      <div class="details-header">
        <div>
          <h2>${esc(app.full_name)}</h2>
          <p>${esc(app.email)}</p>
        </div>
        <span class="status status-${esc(app.status)}">${esc(app.status)}</span>
      </div>

      <div class="detail-grid">
        <div class="detail">
          <strong>Country</strong>
          <div class="detail-value">${esc(app.country)}</div>
        </div>

        <div class="detail">
          <strong>Mobile</strong>
          <div class="detail-value">${esc(app.mobile)}</div>
        </div>

        <div class="detail">
          <strong>Company / Organization</strong>
          <div class="detail-value">${esc(app.company || '—')}</div>
        </div>

        <div class="detail">
          <strong>Experience</strong>
          <div class="detail-value">${esc(app.experience_level)}</div>
        </div>

        <div class="detail detail-full">
          <strong>Skills</strong>
          <div class="detail-value">${esc((app.skills || []).join(', ') || '—')}</div>
        </div>

        <div class="detail">
          <strong>Portfolio</strong>
          <div class="detail-value">${
            app.portfolio_url
              ? `<a href="${esc(app.portfolio_url)}" target="_blank" rel="noopener">Open portfolio</a>`
              : '—'
          }</div>
        </div>

        <div class="detail">
          <strong>Resume</strong>
          <div class="detail-value">${
            app.resume_url
              ? `<a href="${esc(app.resume_url)}" target="_blank" rel="noopener">View resume</a>`
              : '—'
          }</div>
        </div>

        <div class="detail detail-full">
          <strong>About</strong>
          <div class="detail-value">${esc(app.bio || '—')}</div>
        </div>

        <div class="detail">
          <strong>Submitted</strong>
          <div class="detail-value">${esc(app.created_at || '—')}</div>
        </div>

        <div class="detail">
          <strong>Reviewed</strong>
          <div class="detail-value">${esc(app.reviewed_at || '—')}</div>
        </div>

        <div class="detail detail-full">
          <strong>Admin Notes</strong>
          <textarea id="admin-notes" rows="4" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;resize:vertical;background:var(--surface);color:var(--text)">${esc(app.admin_notes || '')}</textarea>
        </div>

        <div class="detail detail-full">
          <strong>Community Invite Link</strong>
          <input id="community-link" type="url" value="${esc(app.community_link || '')}" placeholder="https://chat.whatsapp.com/..." style="width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text)">
        </div>
      </div>

      ${
        app.status === 'pending'
        ? `
          <div style="display:flex;gap:10px;margin-top:22px;flex-wrap:wrap">
            <button class="btn primary" type="button" id="approve-btn">Approve Application</button>
            <button class="btn" type="button" id="reject-btn" style="color:var(--danger);border-color:#f1b8b2">Reject Application</button>
          </div>
        `
        : `
          <div style="margin-top:22px;padding:12px 14px;border-radius:10px;background:var(--surface-soft);color:var(--muted)">
            This application has already been ${esc(app.status)}.
          </div>

          <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
            <button class="btn" type="button" id="delete-application-btn" style="color:var(--danger);border-color:#f1b8b2">
              Delete Application
            </button>
          </div>
        `
      }
    `;

    const approve = document.getElementById('approve-btn');
    const reject = document.getElementById('reject-btn');
    const deleteApplication = document.getElementById('delete-application-btn');

    async function review(status){
      const notes = document.getElementById('admin-notes')?.value || '';
      const communityLink = document.getElementById('community-link')?.value || '';

      if(status === 'approved' && !communityLink.trim()){
        alert('Enter the community invite link before approving this applicant.');
        return;
      }

      const action = status === 'approved' ? 'approve' : 'reject';

      if(!confirm(`Are you sure you want to ${action} this application?`)){
        return;
      }

      try{
        const response = await fetch(`/api/admin/team-up/${Number(app.id)}`,{
          method:'PATCH',
          credentials:'same-origin',
          headers:{
            'Content-Type':'application/json'
          },
          body:JSON.stringify({
            status,
            admin_notes:notes,
            community_link:communityLink
          })
        });

        const data = await response.json();

        if(response.status === 401){
          window.location.href='/admin/login';
          return;
        }

        if(!response.ok){
          throw new Error(data.error || 'Unable to update application');
        }

        const index = applications.findIndex(item => Number(item.id) === Number(app.id));

        if(index !== -1){
          applications[index] = data.application;
        }

        render();
        const updated = applications.find(item => Number(item.id) === Number(app.id));

        if(updated){
          showDetails(updated);
        }

        alert(`Application ${status}.`);

      }catch(error){
        console.error(error);
        alert(error.message || 'Unable to update application.');
      }
    }

    if(approve){
      approve.addEventListener('click',() => review('approved'));
    }

    if(reject){
      reject.addEventListener('click',() => review('rejected'));
    }

    if(deleteApplication){
      deleteApplication.addEventListener('click',async() => {
        const confirmed=confirm(
          `Delete ${app.full_name}'s ${app.status} application?\n\n` +
          'This will permanently remove the application and its uploaded resume.'
        );

        if(!confirmed){
          return;
        }

        deleteApplication.disabled=true;
        deleteApplication.textContent='Deleting...';

        try{
          const response=await fetch(
            `/api/admin/team-up/${Number(app.id)}`,
            {
              method:'DELETE',
              credentials:'same-origin'
            }
          );

          const data=await response.json();

          if(response.status===401){
            window.location.href='/admin/login';
            return;
          }

          if(!response.ok){
            throw new Error(data.error || 'Unable to delete application');
          }

          applications=applications.filter(
            item=>Number(item.id)!==Number(app.id)
          );

          render();
          alert('Application deleted successfully.');

        }catch(error){
          console.error(error);
          deleteApplication.disabled=false;
          deleteApplication.textContent='Delete Application';
          alert(error.message || 'Unable to delete application.');
        }
      });
    }
  }

  function render(){
    if(!applications.length){
      applicationsEl.innerHTML = '<p class="muted">No applications found.</p>';
      messageEl.textContent = '0 applications';
      return;
    }

    messageEl.textContent =
      applications.length + (applications.length === 1 ? ' application' : ' applications');

    applicationsEl.innerHTML = applications.map(app => `
      <button class="application" type="button" data-id="${Number(app.id)}">
        <strong>${esc(app.full_name)}</strong>
        <span>${esc(app.email)}</span>
        <br>
        <span class="status">${esc(app.status)}</span>
      </button>
    `).join('');

    applicationsEl.querySelectorAll('[data-id]').forEach(button => {
      button.addEventListener('click', function(){
        const app = applications.find(x => Number(x.id) === Number(this.dataset.id));
        if(app) showDetails(app);
      });
    });

    showDetails(applications[0]);
  }

  async function load(){
    try{
      const response = await fetch('/api/admin/team-up', {
        credentials:'same-origin',
        cache:'no-store'
      });

      if(response.status === 401){
        window.location.href='/admin/login';
        return;
      }

      const data = await response.json();

      if(!response.ok){
        throw new Error(data.error || 'Failed to load applications');
      }

      applications = Array.isArray(data) ? data : [];
      render();

    }catch(error){
      console.error(error);
      messageEl.textContent = 'Error loading applications';
      applicationsEl.innerHTML =
        '<p style="color:#b42318">Unable to load applications: ' +
        esc(error.message) + '</p>';
    }
  }

  logoutEl.addEventListener('click', async function(){
    await fetch('/api/admin/logout',{
      method:'POST',
      credentials:'same-origin'
    });
    window.location.href='/admin/login';
  });

  load();
})();
</script>

</body>
</html>
